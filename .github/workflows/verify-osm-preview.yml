name: Verify OSM preview
on:
  workflow_call:
    inputs:
      source_run:
        description: Run containing all configured osm-data-preview-{region} artifacts
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: osm-preview-verification-${{ github.ref }}-${{ inputs.source_run }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/download-artifact@v4
        with:
          pattern: osm-data-preview-*
          merge-multiple: true
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: tmp/osm-data
      - name: Verify full files and automatic region selection with current code
        run: |
          node <<'JS'
          const fs = require('node:fs/promises')
          const { selectRegions } = require('./bin/build-osm-regions')
          const { prepare } = require('./bin/prepare-osm-catalog')
          const { check } = require('./bin/check-osm-samples')
          async function main() {
            const root = 'tmp/osm-data'
            const report = await prepare(root, selectRegions())
            await check(root)
            await fs.writeFile(root + '/validation.json', JSON.stringify(report, null, 2))
            console.log(JSON.stringify(report, null, 2))
          }
          main().catch(e => { console.error(e); process.exitCode = 1 })
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: osm-data-preview
          path: tmp/osm-data
          retention-days: 7
