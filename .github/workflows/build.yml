name: build

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      preview_source_run:
        description: Optionally verify all generated OSM regions from a previous run (never publishes)
        type: string
        default: ''
      preview_japan_source_run:
        description: Optionally assemble the preview with gsi-pages-data from this run (never publishes)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14.x, 16.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:data
        if: matrix.node-version == '22.x' || matrix.node-version == '24.x'
      - run: npm run build
      - run: npm run test:integration
        if: matrix.node-version == '22.x' || matrix.node-version == '24.x'
      - uses: actions/setup-python@v5
        if: matrix.node-version == '22.x'
        with:
          python-version: '3.12'
      - run: pip install -r bin/osm-requirements.txt && sudo apt-get update && sudo apt-get install -y osmium-tool
        if: matrix.node-version == '22.x'
      - run: pip install -r bin/japan-admin-requirements.txt && python test/japan-admin.test.py
        if: matrix.node-version == '22.x'
      - run: npm run test:osm
        if: matrix.node-version == '22.x'
      - run: npm pack --dry-run

  verify-preview:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.preview_source_run != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify-osm-preview.yml
    with:
      source_run: ${{ inputs.preview_source_run }}
      japan_source_run: ${{ inputs.preview_japan_source_run }}

  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'geolonia/open-reverse-geocoder'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          scope: '@geolonia'
      - run: npm ci
      - run: npm run build
      - run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
