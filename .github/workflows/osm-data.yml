name: Update OSM data
run-name: OSM data — ${{ inputs.region || 'all' }}

on:
  push:
    branches: [main]
    paths:
      - bin/*osm*
      - bin/*boundaries*
      - .github/workflows/osm-data.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all configured regions from main after validation
        type: boolean
        default: false
      region:
        description: all, europe, europe-core, europe-extra, americas, or a region ID (groups/regions are previews)
        type: string
        default: all
      source_run:
        description: Source run ID, or JSON mapping region/group IDs to run IDs (preview only)
        type: string
        default: ''
  schedule:
    - cron: '43 18 8 1,4,7,10 *'

permissions:
  contents: read
  actions: read

concurrency:
  group: osm-data-${{ github.ref }}-${{ inputs.region || 'all' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.plan.outputs.regions }}
      matrix: ${{ steps.plan.outputs.matrix }}
      single: ${{ steps.plan.outputs.single }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci && npm run build
      - id: plan
        env:
          PUBLISH: ${{ inputs.publish }}
          REGION: ${{ inputs.region || 'all' }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          node <<'JS'
          const fs = require('node:fs')
          const { selectRegions, selectSources } = require('./bin/build-osm-regions')
          const { REGION, SOURCE_RUN, PUBLISH } = process.env
          const regions = selectRegions(REGION)
          const matrix = selectSources(regions, SOURCE_RUN)
          if (PUBLISH === 'true' && (REGION !== 'all' || SOURCE_RUN))
            throw new Error('Publication requires fresh snapshots of all configured regions')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `regions=${JSON.stringify(regions)}\nsingle=${regions.length === 1}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`)
          JS
  generate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run build
      - run: pip install -r bin/osm-requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - id: source
        if: matrix.source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ matrix.source_run }}
          REGION: ${{ matrix.region }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > tmp-source-artifacts.json
          node <<'JS'
          const fs = require('node:fs')
          const names = JSON.parse(fs.readFileSync('tmp-source-artifacts.json')).flatMap(page => page.artifacts).filter(a => !a.expired).map(a => a.name)
          const name = ['osm-build-input-' + process.env.REGION, 'osm-build-input'].find(n => names.includes(n))
          if (!name) throw new Error('Missing reusable source artifact')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${name}\n`)
          JS
      - uses: actions/download-artifact@v4
        if: matrix.source_run != ''
        with:
          name: ${{ steps.source.outputs.name }}
          run-id: ${{ matrix.source_run }}
          github-token: ${{ github.token }}
          path: tmp/osm-source
      - name: Generate and verify region
        env:
          REGION: ${{ matrix.region }}
          SOURCE_RUN: ${{ matrix.source_run }}
        run: |
          args=()
          if [ -n "$SOURCE_RUN" ]; then args+=(--reuse-input); fi
          node bin/build-osm-regions.js --region "$REGION" --source tmp/osm-source --output tmp/osm-data --version "run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ needs.plan.outputs.single == 'true' && 'osm-build-input' || format('osm-build-input-{0}', matrix.region) }}
          path: |
            tmp/osm-source/**/features.geojsonseq
            tmp/osm-source/**/region.json
            tmp/osm-source/**/generation-region.json
            tmp/osm-source/**/SHA256SUMS
            tmp/osm-source/**/snapshot.txt
            tmp/osm-source/**/geometry-errors.log
            tmp/osm-source/**/boundary-sources.json
            tmp/osm-source/**/EXPORT-SHA256SUMS
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ needs.plan.outputs.single == 'true' && 'osm-data-preview' || format('osm-data-preview-{0}', matrix.region) }}
          path: tmp/osm-data
          if-no-files-found: ignore
          retention-days: 7
  assemble:
    needs: [plan, generate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/download-artifact@v4
        with:
          pattern: osm-data-preview*
          merge-multiple: true
          path: tmp/osm-data
      - name: Verify complete group and cross-region search
        env:
          EXPECTED_REGIONS: ${{ needs.plan.outputs.regions }}
        run: |
          node <<'JS'
          const fs = require('node:fs/promises')
          const { prepare } = require('./bin/prepare-osm-catalog')
          const { check } = require('./bin/check-osm-samples')
          async function main() {
            const root = 'tmp/osm-data'
            const report = await prepare(root, JSON.parse(process.env.EXPECTED_REGIONS))
            await check(root)
            await fs.writeFile(root + '/validation.json', JSON.stringify(report, null, 2))
            console.log(JSON.stringify(report, null, 2))
          }
          main().catch(e => { console.error(e); process.exitCode = 1 })
          JS
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.single != 'true'
        with:
          name: osm-data-preview
          path: tmp/osm-data
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.ref_name == github.event.repository.default_branch && !inputs.source_run && (inputs.region == '' || inputs.region == 'all') && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish)
        with:
          name: osm-pages-data
          path: tmp/osm-data
          retention-days: 90
