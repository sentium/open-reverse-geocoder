name: Update OSM data

on:
  push:
    branches: [main]
    paths:
      - bin/build-osm-regions.js
      - bin/osm-regions.json
      - bin/check-osm-samples.js
      - bin/prepare-osm-catalog.js
      - bin/validate-osm-data.js
      - bin/build-osm-data.py
      - bin/osm-export.json
      - bin/osm-requirements.txt
      - bin/complete-osm-boundaries.py
      - bin/us-boundaries.json
      - .github/workflows/osm-data.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all configured regions from main after validation
        type: boolean
        default: false
      region:
        description: Generate all regions, or one region for preview only
        type: choice
        options: [all, us, taiwan, south-korea]
        default: all
      source_run:
        description: Reuse osm-build-input from a prior run for preview validation only
        type: string
        default: ''
  schedule:
    - cron: '43 18 8 1,4,7,10 *'

permissions:
  contents: read
  actions: read

concurrency:
  group: osm-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run build
      - run: pip install -r bin/osm-requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Reject partial or reused publication inputs
        env:
          PUBLISH: ${{ inputs.publish }}
          REGION: ${{ inputs.region || 'all' }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          if [ "$PUBLISH" = true ] && { [ "$REGION" != all ] || [ -n "$SOURCE_RUN" ]; }; then
            echo 'Publication requires fresh snapshots of all configured regions. Single-region and reused-input builds are previews only.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        if: inputs.source_run
        with:
          name: osm-build-input
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: tmp/osm-source
      - name: Generate and verify configured OSM regions
        env:
          REGION: ${{ inputs.region || 'all' }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          args=()
          if [ -n "$SOURCE_RUN" ]; then args+=(--reuse-input); fi
          node bin/build-osm-regions.js --region "$REGION" --source tmp/osm-source --output tmp/osm-data --version "run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osm-build-input
          path: |
            tmp/osm-source/**/features.geojsonseq
            tmp/osm-source/**/region.json
            tmp/osm-source/**/SHA256SUMS
            tmp/osm-source/**/snapshot.txt
            tmp/osm-source/**/geometry-errors.log
            tmp/osm-source/**/boundary-sources.json
            tmp/osm-source/**/EXPORT-SHA256SUMS
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osm-data-preview
          path: tmp/osm-data
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.ref_name == github.event.repository.default_branch && !inputs.source_run && (inputs.region == '' || inputs.region == 'all') && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish)
        with:
          name: osm-pages-data
          path: tmp/osm-data
          retention-days: 90
